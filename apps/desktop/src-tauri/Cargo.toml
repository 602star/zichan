[package]
name = "zichan"
version = "0.1.0"
description = "资产生命周期 · Lifecycle Ledger"
edition = "2021"
rust-version = "1.77.2"
default-run = "zichan"

[lib]
name = "zichan_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[features]
release-verifier = ["dep:base64", "dep:minisign-verify"]

[[bin]]
name = "verify-updater-signature"
path = "src/bin/verify-updater-signature.rs"
required-features = ["release-verifier"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-stronghold = "2"
tauri-plugin-system-share = { path = "../plugins/system-share" }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
libsqlite3-sys = { version = "0.30.1", features = ["bundled-sqlcipher-vendored-openssl"] }
fs2 = "0.4"
tokio = { version = "1", features = ["sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = { version = "0.22", optional = true }
minisign-verify = { version = "0.2.5", optional = true }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"
tauri-plugin-biometric = "2"
tauri-plugin-geolocation = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2.10"

[profile.dev.package.scrypt]
opt-level = 3
