[package]
name = "zichan"
version = "0.3.4"
description = "资产生命周期 · Lifecycle Ledger"
edition = "2021"
rust-version = "1.90"
default-run = "zichan"

[lib]
name = "zichan_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-stronghold = "2"
tauri-plugin-system-share = { path = "../plugins/system-share" }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
libsqlite3-sys = { version = "0.30.1", features = ["bundled-sqlcipher-vendored-openssl"] }
fs2 = "0.4"
tokio = { version = "1", features = ["sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zeroize = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_System_WindowsProgramming", "Win32_UI_Controls_Dialogs", "Win32_UI_WindowsAndMessaging"] }
windows-version = "0.1"
zip = { version = "4", default-features = false, features = ["deflate"] }

[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"
tauri-plugin-biometric = "2"
tauri-plugin-geolocation = "2"

[target.'cfg(target_os = "android")'.dependencies]
base64 = "0.22"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream"] }
ring = "0.17"

[profile.dev.package.scrypt]
opt-level = 3
