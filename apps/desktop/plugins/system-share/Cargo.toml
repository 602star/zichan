[package]
name = "tauri-plugin-system-share"
version = "0.3.0"
description = "Native backup file sharing for Zichan"
edition = "2021"
rust-version = "1.77.2"
links = "tauri-plugin-system-share"

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2" }
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
