# HTTPS-terminated deployment: Caddy (auto Let's Encrypt) in front of the unified server.
# Usage: SYNC_SECRET=$(openssl rand -hex 32) docker compose up -d
services:
  sync-server:
    build:
      context: ../..
      dockerfile: apps/sync-server/Dockerfile
    environment:
      - PORT=8787
      - HOST=0.0.0.0
      - DATA_DIR=/state/server
      - COMMIT_QUOTA_BYTES=${COMMIT_QUOTA_BYTES:-21474836480}
      - ATTACHMENT_QUOTA_BYTES=${ATTACHMENT_QUOTA_BYTES:-21474836480}
      - ATTACHMENT_MAX_FILE_BYTES=${ATTACHMENT_MAX_FILE_BYTES:-104857600}
      - ATTACHMENT_TRASH_RETENTION_MS=${ATTACHMENT_TRASH_RETENTION_MS:-2592000000}
      - SYNC_SECRET=${SYNC_SECRET:?set SYNC_SECRET (e.g. openssl rand -hex 32)}
      - REGISTRATION_MODE=${REGISTRATION_MODE:-invite}
      - ENABLE_WEB=${ENABLE_WEB:-1}
      - ENABLE_SYNC=${ENABLE_SYNC:-1}
      - BASE_PATH=${BASE_PATH:-}
      - ADMIN_ACCESS_PATH=${ADMIN_ACCESS_PATH:-}
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-private}
      - ALLOW_INSECURE_HTTP=0
      - WEB_DIST=/app/web-dist
    volumes:
      - zichan-data:/state
    expose:
      - "8787"
    healthcheck:
      test: ["CMD", "node", "-e", "const p=(process.env.BASE_PATH||'').replace(/\\/$/,'');fetch('http://127.0.0.1:8787'+p+'/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  caddy:
    image: caddy:2
    depends_on:
      sync-server:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  zichan-data: {}
  caddy-data: {}
  caddy-config: {}
