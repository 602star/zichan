name: zichan-prod

# Direct HTTP is enabled for trusted LAN deployments. Restrict port 8787 at
# the host firewall; public deployments should use an HTTPS reverse proxy.
services:
  sync-server:
    image: ${ZICHAN_IMAGE:?Set ZICHAN_IMAGE to a verified sha256 digest}
    network_mode: host
    init: true
    user: '1000:1000'
    environment:
      PORT: '8787'
      HOST: ${ZICHAN_HOST:-0.0.0.0}
      DATA_DIR: /state/server
      ADMIN_BACKUP_DIRECTORY: /backups
      WEB_DIST: /app/runtime/current/web-dist
      ZICHAN_UPDATE_RUNTIME_DIR: /app/runtime
      ZICHAN_UPDATE_REQUIRE_BACKUP: '1'
      UPDATE_GITHUB_REPO: 602star/zichan
      UPDATE_GITHUB_TOKEN_FILE: /keys/github-token
      UPDATE_PUBLIC_KEY_PATH: /app/bootstrap/update-public.pem
      TZ: ${ZICHAN_TZ:-Asia/Shanghai}
      TRUSTED_PROXIES: '127.0.0.1'
      ALLOW_INSECURE_HTTP: ${ZICHAN_ALLOW_INSECURE_HTTP:-1}
      REGISTRATION_MODE: ${REGISTRATION_MODE:-invite}
      ENABLE_WEB: '1'
      ENABLE_SYNC: '1'
      BASE_PATH: ${BASE_PATH:-}
      ADMIN_ACCESS_PATH: ${ADMIN_ACCESS_PATH:-}
      COMMIT_QUOTA_BYTES: ${COMMIT_QUOTA_BYTES:-21474836480}
      ATTACHMENT_QUOTA_BYTES: ${ATTACHMENT_QUOTA_BYTES:-21474836480}
      ATTACHMENT_MAX_FILE_BYTES: ${ATTACHMENT_MAX_FILE_BYTES:-104857600}
      ATTACHMENT_TRASH_RETENTION_MS: ${ATTACHMENT_TRASH_RETENTION_MS:-2592000000}
    volumes:
      - type: bind
        source: ${ZICHAN_STATE_DIR:-/srv/zichan/state}
        target: /state
        bind:
          create_host_path: false
      - type: bind
        source: ${ZICHAN_BACKUP_DIR:-/srv/zichan/backups}
        target: /backups
        bind:
          create_host_path: false
      - type: bind
        source: ${ZICHAN_RUNTIME_DIR:-/srv/zichan/runtime}
        target: /app/runtime
        bind:
          create_host_path: false
    healthcheck:
      test: ['CMD', 'node', '-e', "const p=(process.env.BASE_PATH||'').replace(/\\/$/,'');fetch('http://127.0.0.1:8787'+p+'/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 30m
