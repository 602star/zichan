name: Android release APK

on:
  workflow_call:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: production-release
    env:
      ZICHAN_ANDROID_UPDATE_URL: ${{ vars.ZICHAN_ANDROID_UPDATE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Configure Android NDK
        shell: bash
        run: |
          set -euo pipefail
          ndk="${ANDROID_NDK:-}"
          if [[ -z "$ndk" || ! -d "$ndk" ]]; then
            ndk="$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d -name '27.*' | sort -V | tail -n 1)"
          fi
          test -d "$ndk"
          ranlib="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ranlib"
          test -x "$ranlib"
          echo "NDK_HOME=$ndk" >> "$GITHUB_ENV"
          echo "TARGET_RANLIB=$ranlib" >> "$GITHUB_ENV"
      - run: npm ci
      - run: node scripts/release/check-consistency.mjs --tag "${{ github.ref_name }}"
      - name: Generate Android project
        run: npm run mobile:init:android
      - name: Build ARM64 APK
        run: npm run mobile:build:android -- --apk --target aarch64
      - name: Sign and verify release APK and update feed
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          ANDROID_UPDATE_SIGNING_KEY_PEM: ${{ secrets.ANDROID_UPDATE_SIGNING_KEY_PEM }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_RELEASE_KEYSTORE_BASE64"
          test -n "$ANDROID_RELEASE_KEYSTORE_PASSWORD"
          test -n "$ANDROID_RELEASE_KEY_ALIAS"
          test -n "$ANDROID_RELEASE_KEY_PASSWORD"
          test -n "$ANDROID_UPDATE_SIGNING_KEY_PEM"
          source_apk='apps/desktop/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk'
          test -s "$source_apk"
          unzip -t "$source_apk" > /dev/null
          unzip -Z1 "$source_apk" | grep '^lib/arm64-v8a/libzichan_lib.so$'

          apksigner="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner"
          umask 077
          key="$RUNNER_TEMP/zichan-android-release.jks"
          feed_key="$RUNNER_TEMP/zichan-android-feed.pem"
          trap 'rm -f "$key" "$feed_key"' EXIT
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 -d > "$key"
          printf '%s' "$ANDROID_UPDATE_SIGNING_KEY_PEM" > "$feed_key"
          mkdir -p release-apk
          signed="$RUNNER_TEMP/zichan-android-arm64-signed.apk"
          "$apksigner" sign --ks "$key" --ks-key-alias "$ANDROID_RELEASE_KEY_ALIAS" --ks-pass env:ANDROID_RELEASE_KEYSTORE_PASSWORD --key-pass env:ANDROID_RELEASE_KEY_PASSWORD --out "$signed" "$source_apk"
          "$apksigner" verify --verbose "$signed"
          node scripts/release/create-android-update-feed.mjs "$feed_key" "$signed" release-apk
          node scripts/release/verify-android-update-feed.mjs "$feed_key" release-apk/android-latest.json
          (cd release-apk && sha256sum *.apk > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: android-arm64-release
          path: release-apk/
          if-no-files-found: error
