name: Linux desktop release verification

on:
  workflow_dispatch:
    inputs:
      previous_release_tag:
        description: Optional earlier release tag in this repository for cross-version upgrade verification
        required: false
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  linux-x64:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Install Linux desktop build and GUI smoke dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev \
            patchelf libfuse2 libatomic1 file xvfb xauth dbus-x11 xdotool
      - run: npm ci
      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/release/check-consistency.mjs --tag '${{ github.ref_name }}'
      - name: Build and verify DEB and AppImage
        run: bash scripts/linux/build-desktop.sh
      - name: Download historical DEB when supplied
        if: github.event_name == 'workflow_dispatch' && inputs.previous_release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_RELEASE_TAG: ${{ inputs.previous_release_tag }}
        run: |
          mkdir -p "$RUNNER_TEMP/zichan-previous"
          gh release download "$PREVIOUS_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern '*.deb*' --dir "$RUNNER_TEMP/zichan-previous"
          packages=("$RUNNER_TEMP"/zichan-previous/*.deb)
          test "${#packages[@]}" -eq 1
          test -f "${packages[0]}.sha256"
          (cd "$RUNNER_TEMP/zichan-previous" && sha256sum --check "$(basename "${packages[0]}.sha256")")
          echo "ZICHAN_PREVIOUS_DEB=${packages[0]}" >> "$GITHUB_ENV"
      - name: Verify package install, upgrade, uninstall, and launch
        run: bash scripts/linux/test-package-lifecycle.sh
      - name: Upload verified Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64-deb-appimage
          path: |
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb.sha256
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage.sha256
          if-no-files-found: error
