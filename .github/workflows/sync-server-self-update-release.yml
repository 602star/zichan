name: Signed sync server self-update release

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      tag_commit: ${{ steps.provenance.outputs.tag_commit }}
    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$GITHUB_REF" == refs/tags/v* ]] || { echo 'Release requires a version tag' >&2; exit 2; }
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 2
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - name: Pin the tag commit
        id: provenance
        run: echo "tag_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - name: Check tag and build signed-update candidate
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -Eeuo pipefail
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          node scripts/release/check-consistency.mjs --tag "$RELEASE_TAG"
          npm run build:server
          node scripts/release/create-update-package.mjs --unsigned candidate
      - uses: actions/upload-artifact@v6
        with:
          name: unsigned-sync-update
          path: candidate/zichan-*.json
          if-no-files-found: error

  sign:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production-release
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@v7
        with:
          name: unsigned-sync-update
          path: release
      - name: Sign with protected Ed25519 key
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          ZICHAN_UPDATE_SIGNING_KEY_PEM: ${{ secrets.ZICHAN_UPDATE_SIGNING_KEY_PEM }}
          ZICHAN_UPDATE_PUBLIC_KEY_SHA256: ${{ vars.ZICHAN_UPDATE_PUBLIC_KEY_SHA256 }}
        run: |
          set -Eeuo pipefail
          test -n "$ZICHAN_UPDATE_SIGNING_KEY_PEM"
          key="$RUNNER_TEMP/zichan-update-signing.pem"
          trap 'rm -f "$key"' EXIT
          umask 077
          printf '%s' "$ZICHAN_UPDATE_SIGNING_KEY_PEM" > "$key"
          node scripts/release/sign-update-package.mjs "$RELEASE_TAG" "$key" \
            "release/zichan-${RELEASE_TAG#v}.json" release
          openssl pkey -in "$key" -pubout -out release/update-public.pem
          [[ "$ZICHAN_UPDATE_PUBLIC_KEY_SHA256" =~ ^[a-f0-9]{64}$ ]]
          actual="$(sha256sum release/update-public.pem | cut -d ' ' -f 1)"
          test "$actual" = "$ZICHAN_UPDATE_PUBLIC_KEY_SHA256"
          cmp release/update-public.pem apps/sync-server/keys/update-public.pem
          node scripts/release/verify-update-package.mjs release/update-public.pem release/latest.json \
            "release/zichan-${RELEASE_TAG#v}.json"
          printf 'Update public key SHA-256: `%s`\n' "$actual" >> "$GITHUB_STEP_SUMMARY"
      - name: Recheck release tag commit
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          EXPECTED_TAG_COMMIT: ${{ needs.build.outputs.tag_commit }}
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$EXPECTED_TAG_COMMIT"
      - uses: actions/upload-artifact@v6
        with:
          name: signed-sync-update
          path: |
            release/zichan-*.json
            release/latest.json
          if-no-files-found: error
