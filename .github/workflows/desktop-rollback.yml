name: Desktop Rollback

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: Previously published stable tag to expose as the signed rollback
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish-rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and validate signed source manifest
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TAG: ${{ inputs.source_tag }}
        run: |
          mkdir rollback
          gh release download "$SOURCE_TAG" --pattern latest.json --dir rollback
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('rollback/latest.json'));if(!p.version||!p.platforms||!Object.values(p.platforms).length)throw Error('invalid source manifest');for(const row of Object.values(p.platforms)){if(!row.url||!row.signature)throw Error('unsigned source entry')}p.notes='管理员回退：'+p.version+'\\n\\n'+(p.notes||'');fs.writeFileSync('rollback/rollback.json',JSON.stringify(p,null,2)+'\\n')"
      - name: Publish rollback pointer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view desktop-rollback >/dev/null 2>&1 || gh release create desktop-rollback --title "Desktop signed rollback" --notes "Controlled pointer to a previously signed desktop release." --prerelease
          gh release upload desktop-rollback rollback/rollback.json --clobber
