name: Android candidate APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ZICHAN_ANDROID_UPDATE_URL: ${{ vars.ZICHAN_ANDROID_UPDATE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Configure Android NDK
        shell: bash
        run: |
          set -euo pipefail
          ndk="${ANDROID_NDK:-}"
          if [[ -z "$ndk" || ! -d "$ndk" ]]; then
            ndk="$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d -name '27.*' | sort -V | tail -n 1)"
          fi
          test -d "$ndk"
          ranlib="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ranlib"
          test -x "$ranlib"
          echo "NDK_HOME=$ndk" >> "$GITHUB_ENV"
          echo "TARGET_RANLIB=$ranlib" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Generate Android project
        run: npm run mobile:init:android
      - name: Build ARM64 APK
        run: npm run mobile:build:android -- --apk --target aarch64
      - name: Verify candidate APK and sign with a stable test key when configured
        shell: bash
        env:
          ANDROID_TEST_KEYSTORE_BASE64: ${{ secrets.ANDROID_TEST_KEYSTORE_BASE64 }}
          ANDROID_TEST_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_TEST_KEYSTORE_PASSWORD }}
          ANDROID_TEST_KEY_ALIAS: ${{ secrets.ANDROID_TEST_KEY_ALIAS }}
          ANDROID_TEST_KEY_PASSWORD: ${{ secrets.ANDROID_TEST_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          source_apk='apps/desktop/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk'
          test -s "$source_apk"
          unzip -t "$source_apk" > /dev/null
          unzip -Z1 "$source_apk" | grep '^lib/arm64-v8a/libzichan_lib.so$'

          apksigner="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner"
          mkdir -p candidate-apk
          cp "$source_apk" candidate-apk/zichan-android-arm64-unsigned.apk
          if [[ -n "$ANDROID_TEST_KEYSTORE_BASE64" && -n "$ANDROID_TEST_KEYSTORE_PASSWORD" && -n "$ANDROID_TEST_KEY_ALIAS" && -n "$ANDROID_TEST_KEY_PASSWORD" ]]; then
            printf '%s' "$ANDROID_TEST_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/zichan-android-test.jks"
            "$apksigner" sign --ks "$RUNNER_TEMP/zichan-android-test.jks" --ks-key-alias "$ANDROID_TEST_KEY_ALIAS" --ks-pass env:ANDROID_TEST_KEYSTORE_PASSWORD --key-pass env:ANDROID_TEST_KEY_PASSWORD --out candidate-apk/zichan-android-arm64-test.apk candidate-apk/zichan-android-arm64-unsigned.apk
            "$apksigner" verify --verbose candidate-apk/zichan-android-arm64-test.apk
          else
            echo 'No stable Android test signing key configured; only unsigned APK is available.'
          fi
          (cd candidate-apk && sha256sum *.apk > SHA256SUMS)
          printf '%s\n' "$GITHUB_SHA" > candidate-apk/COMMIT
      - uses: actions/upload-artifact@v4
        with:
          name: android-arm64-candidate-${{ github.sha }}
          path: candidate-apk/
          if-no-files-found: error
