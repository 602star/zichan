name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Update channel
        required: true
        type: choice
        default: preview
        options:
          - preview
          - stable
      publish:
        description: Publish a GitHub release after clean install succeeds
        required: true
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      ZICHAN_UPDATE_PUBLIC_KEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
      ZICHAN_UPDATE_STABLE_ENDPOINT: https://github.com/${{ github.repository }}/releases/latest/download/latest.json
      ZICHAN_UPDATE_PREVIEW_ENDPOINT: https://github.com/${{ github.repository }}/releases/download/desktop-preview/preview.json
      ZICHAN_UPDATE_ROLLBACK_ENDPOINT: https://github.com/${{ github.repository }}/releases/download/desktop-rollback/rollback.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: npm ci

      - name: Verify project version, release notes, and schema metadata
        run: npm run release:check

      - name: Test release integrity gates
        run: npm run test:release

      - name: Resolve release metadata
        id: metadata
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $isTag = '${{ github.ref_type }}' -eq 'tag'
          $isDispatch = '${{ github.event_name }}' -eq 'workflow_dispatch'
          $channel = if (-not $isDispatch -and $isTag) { 'stable' } else { '${{ inputs.channel }}' }
          $publish = $isDispatch -and '${{ inputs.publish }}' -eq 'true'
          if ($channel -eq 'stable' -and $isTag -and '${{ github.ref_name }}' -ne "v$version") {
            throw "Stable release tag must be exactly v$version."
          }
          if ($publish -and $channel -eq 'stable' -and (-not $isTag -or '${{ github.ref_name }}' -ne "v$version")) {
            throw "Publishing stable requires manually dispatching this workflow from the existing v$version tag."
          }
          $tag = if ($channel -eq 'stable') {
            "v$version"
          } else {
            'desktop-preview'
          }
          "RELEASE_CHANNEL=$channel" | Out-File $env:GITHUB_ENV -Append
          "PUBLISH_RELEASE=$($publish.ToString().ToLowerInvariant())" | Out-File $env:GITHUB_ENV -Append
          "RELEASE_TAG=$tag" | Out-File $env:GITHUB_ENV -Append
          "APP_VERSION=$version" | Out-File $env:GITHUB_ENV -Append
          "MANIFEST_NAME=$(if ($channel -eq 'stable') { 'latest.json' } else { 'preview.json' })" | Out-File $env:GITHUB_ENV -Append
          "channel=$channel" | Out-File $env:GITHUB_OUTPUT -Append
          "publish=$($publish.ToString().ToLowerInvariant())" | Out-File $env:GITHUB_OUTPUT -Append
          "tag=$tag" | Out-File $env:GITHUB_OUTPUT -Append
          "version=$version" | Out-File $env:GITHUB_OUTPUT -Append
          "manifest=$(if ($channel -eq 'stable') { 'latest.json' } else { 'preview.json' })" | Out-File $env:GITHUB_OUTPUT -Append

      - name: Require channel signing material
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) { throw 'TAURI_SIGNING_PRIVATE_KEY is required.' }
          if ([string]::IsNullOrWhiteSpace($env:ZICHAN_UPDATE_PUBLIC_KEY)) { throw 'TAURI_SIGNING_PUBLIC_KEY is required.' }
          if ($env:RELEASE_CHANNEL -eq 'stable') {
            if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64)) { throw 'WINDOWS_CERTIFICATE_BASE64 is required for stable releases.' }
            if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) { throw 'WINDOWS_CERTIFICATE_PASSWORD is required for stable releases.' }
          }

      - name: Import Windows signing certificate
        if: ${{ env.WINDOWS_CERTIFICATE_BASE64 != '' }}
        shell: pwsh
        env:
          PFX_BASE64: ${{ env.WINDOWS_CERTIFICATE_BASE64 }}
          PFX_PASSWORD: ${{ env.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP 'zichan-signing.pfx'
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:PFX_BASE64))
          $password = ConvertTo-SecureString $env:PFX_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          "WINDOWS_CERT_THUMBPRINT=$($certificate.Thumbprint)" | Out-File $env:GITHUB_ENV -Append

      - name: Build installers and updater artifacts
        shell: pwsh
        run: |
          $bundle = @{
            createUpdaterArtifacts = $true
            targets = @('msi', 'nsis')
            windows = @{
              wix = @{ language = 'zh-CN' }
              nsis = @{ languages = @('SimpChinese', 'English') }
            }
          }
          if (-not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERT_THUMBPRINT)) {
            $bundle.windows['certificateThumbprint'] = $env:WINDOWS_CERT_THUMBPRINT
            $bundle.windows['digestAlgorithm'] = 'sha256'
            $bundle.windows['timestampUrl'] = 'http://timestamp.digicert.com'
            $bundle.windows['tsp'] = $true
          }
          $configPath = Join-Path $env:RUNNER_TEMP 'tauri-release.json'
          @{ bundle = $bundle } | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath $configPath -Encoding utf8
          npm run tauri --workspace @zichan/desktop -- build --config $configPath --ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          if (-not (Test-Path apps/desktop/src-tauri/target/release/zichan.exe -PathType Leaf)) {
            throw 'Desktop executable was not generated: target/release/zichan.exe'
          }
          if (-not (Get-ChildItem apps/desktop/src-tauri/target/release/bundle/msi -Filter *.msi -File -ErrorAction SilentlyContinue)) {
            throw 'MSI installer was not generated.'
          }
          if (-not (Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis -Filter *.exe -File -ErrorAction SilentlyContinue)) {
            throw 'NSIS installer was not generated.'
          }
          $wixSource = Get-Content apps/desktop/src-tauri/target/release/wix/x64/main.wxs -Raw
          if (-not $wixSource.Contains('target\release\zichan.exe')) {
            throw 'WiX package does not target zichan.exe.'
          }
          if ($wixSource.Contains('verify-updater-signature')) {
            throw 'Release verifier leaked into the MSI package.'
          }

      - name: Verify Authenticode signatures
        if: ${{ env.WINDOWS_CERTIFICATE_BASE64 != '' }}
        shell: pwsh
        run: |
          $artifacts = Get-ChildItem apps/desktop/src-tauri/target/release/bundle -Recurse -File |
            Where-Object Extension -In '.exe', '.msi'
          if (-not $artifacts) { throw 'No Windows installer artifacts were generated.' }
          foreach ($artifact in $artifacts) {
            $signature = Get-AuthenticodeSignature -LiteralPath $artifact.FullName
            if ($signature.Status -ne 'Valid') {
              throw "Invalid signature on $($artifact.FullName): $($signature.Status)"
            }
          }

      - name: Generate signed update manifest
        shell: pwsh
        run: |
          node apps/desktop/scripts/create-update-manifest.mjs `
            --bundle-dir apps/desktop/src-tauri/target/release/bundle `
            --output "apps/desktop/src-tauri/target/release/bundle/$env:MANIFEST_NAME" `
            --tag "$env:RELEASE_TAG" `
            --repository '${{ github.repository }}' `
            --version "$env:APP_VERSION" `
            --notes-file docs/release-notes.md

      - name: Verify installer and manifest structure
        shell: pwsh
        run: |
          node scripts/release/verify-artifacts.mjs `
            --bundle-dir apps/desktop/src-tauri/target/release/bundle `
            --manifest "apps/desktop/src-tauri/target/release/bundle/$env:MANIFEST_NAME" `
            --version "$env:APP_VERSION" `
            --tag "$env:RELEASE_TAG"

      - name: Cryptographically verify updater archives
        shell: pwsh
        run: |
          cargo run --locked --release `
            --manifest-path apps/desktop/src-tauri/Cargo.toml `
            --features release-verifier `
            --bin verify-updater-signature -- `
            --bundle-dir apps/desktop/src-tauri/target/release/bundle `
            --public-key-env ZICHAN_UPDATE_PUBLIC_KEY

      - name: Clean-runner install, launch, and uninstall
        shell: pwsh
        run: |
          $msi = Get-ChildItem apps/desktop/src-tauri/target/release/bundle/msi -Filter *.msi |
            Select-Object -First 1
          if (-not $msi) { throw 'MSI installer was not generated.' }
          ./scripts/release/test-windows-installer.ps1 -MsiPath $msi.FullName

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: zichan-windows-${{ steps.metadata.outputs.channel }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/msi/*.zip
            apps/desktop/src-tauri/target/release/bundle/msi/*.sig
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*.zip
            apps/desktop/src-tauri/target/release/bundle/nsis/*.sig
            apps/desktop/src-tauri/target/release/bundle/${{ steps.metadata.outputs.manifest }}
          if-no-files-found: error

      - name: Verify publication tag already exists
        if: ${{ steps.metadata.outputs.publish == 'true' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/git/ref/tags/$env:RELEASE_TAG" | Out-Null

      - name: Publish stable or preview release
        if: ${{ steps.metadata.outputs.publish == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.metadata.outputs.tag }}
          name: ${{ steps.metadata.outputs.channel == 'stable' && format('资产生命周期 {0}', steps.metadata.outputs.version) || '资产生命周期测试通道' }}
          body_path: docs/release-notes.md
          prerelease: ${{ steps.metadata.outputs.channel != 'stable' }}
          make_latest: ${{ steps.metadata.outputs.channel == 'stable' }}
          files: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/msi/*.zip
            apps/desktop/src-tauri/target/release/bundle/msi/*.sig
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*.zip
            apps/desktop/src-tauri/target/release/bundle/nsis/*.sig
            apps/desktop/src-tauri/target/release/bundle/${{ steps.metadata.outputs.manifest }}
