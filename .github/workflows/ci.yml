name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Verify release and schema metadata
        run: npm run release:check
      - name: Test release gates
        run: npm run test:release
      - name: Build server and Web before integration tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ci-artifacts | Out-Null
          npm run build:server 2>&1 | Tee-Object ci-artifacts/sync-server-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test managed launchers and isolated server lifecycle
        run: npm run test:scripts
      - name: Install isolated quality tools
        run: |
          npm ci --prefix tools/eslint
          npm ci --prefix tools/coverage
      - run: npm run lint
      - run: npm run typecheck
      - name: Verify Node SQLite schema/query contract
        run: npm test --workspace @zichan/db -- test/schema-baseline.test.ts test/transaction.test.ts
      - name: Verify sql.js and Tauri bridge contracts
        run: npm test --workspace @zichan/web -- test/sqljs-driver.test.ts test/tauri-sql-driver.test.ts
      - run: npm run test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore
      - name: Upload quality failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: quality-failure-logs
          path: ci-artifacts/
          if-no-files-found: ignore

  desktop-rust:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: npm ci
      - name: Export the canonical database schema for SQLCipher
        shell: pwsh
        run: |
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $contract = Join-Path $env:RUNNER_TEMP 'zichan-schema-contract.json'
          node tools/ci/export-schema-contract.mjs --output $contract
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "ZICHAN_SCHEMA_CONTRACT_PATH=$contract" | Out-File $env:GITHUB_ENV -Append
      - name: Format, check, and test desktop Rust
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ci-artifacts | Out-Null
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check 2>&1 | Tee-Object ci-artifacts/cargo-fmt.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fmt --manifest-path apps/desktop/plugins/system-share/Cargo.toml -- --check 2>&1 | Tee-Object ci-artifacts/plugin-cargo-fmt.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo check --locked --manifest-path apps/desktop/src-tauri/Cargo.toml 2>&1 | Tee-Object ci-artifacts/cargo-check.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo check --release --locked --manifest-path apps/desktop/src-tauri/Cargo.toml 2>&1 | Tee-Object ci-artifacts/cargo-check-release.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml 2>&1 | Tee-Object ci-artifacts/cargo-test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml generated_schema_contract_executes_on_sqlcipher -- --ignored 2>&1 | Tee-Object ci-artifacts/schema-contract.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Rust failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-rust-failure-logs
          path: ci-artifacts/
          if-no-files-found: ignore

  sync-server-container:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Build image and verify health endpoints
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p ci-artifacts "$RUNNER_TEMP/zichan-sync-state"
          container=zichan-sync-ci
          cleanup() {
            docker logs "$container" > ci-artifacts/docker-container.log 2>&1 || true
            docker inspect "$container" > ci-artifacts/docker-inspect.json 2>&1 || true
            docker rm --force "$container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker build --file apps/sync-server/Dockerfile --tag "zichan-sync-ci:${GITHUB_SHA}" . 2>&1 | tee ci-artifacts/docker-build.log
          # Only the two bundled server entries and built Web assets belong in /app.
          docker run --rm --entrypoint sh "zichan-sync-ci:${GITHUB_SHA}" -c '
            set -eu
            test -s /app/dist/server.mjs
            test -s /app/dist/maintenance.mjs
            test -s /app/web-dist/index.html
            test "$(find /app/dist -type f | wc -l)" -eq 2
            if find /app -type f \( -name "*.map" -o -name "*.ts" -o -name "*.tsx" -o -name "*.d.ts" \) | grep -q .; then
              echo "runtime image contains source maps or TypeScript files" >&2
              exit 1
            fi
          '
          # The image defaults to an unprivileged user; CI matches the runner uid so the
          # bind-mounted state directory stays writable without granting root.
          docker run --detach --name "$container" \
            --user "$(id -u):$(id -g)" \
            --publish 127.0.0.1:18787:8787 \
            --env HOST=0.0.0.0 \
            --env DATA_DIR=/state/server \
            --env REGISTRATION_MODE=open \
            --env ENABLE_WEB=0 \
            --env ENABLE_SYNC=1 \
            --env ALLOW_INSECURE_HTTP=1 \
            --mount "type=bind,src=$RUNNER_TEMP/zichan-sync-state,dst=/state" \
            "zichan-sync-ci:${GITHUB_SHA}"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:18787/api/health --output ci-artifacts/health.json; then
              break
            fi
            if ! docker inspect --format '{{.State.Running}}' "$container" | grep --quiet true; then
              echo 'sync-server container stopped before becoming healthy' >&2
              docker logs "$container" >&2 || true
              exit 1
            fi
            sleep 2
          done
          test -s ci-artifacts/health.json
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 5 http://127.0.0.1:18787/api/ready --output ci-artifacts/ready.json; then
              break
            fi
            if ! docker inspect --format '{{.State.Running}}' "$container" | grep --quiet true; then
              echo 'sync-server container stopped during readiness probing' >&2
              docker logs "$container" >&2 || true
              exit 1
            fi
            sleep 2
          done
          test -s ci-artifacts/ready.json
          jq --exit-status '.ok == true' ci-artifacts/health.json >/dev/null
          # Readiness is a lightweight probe now: it must not run a whole-database check,
          # because the container healthcheck calls it every 30 seconds.
          jq --exit-status '.ok == true and .mode == "light" and .database.ok == true and .database.result == "ok"' ci-artifacts/ready.json >/dev/null
          # The image defaults to node; this CI container deliberately overrides it
          # with the runner UID so the bind mount is writable.
          test "$(docker image inspect --format '{{.Config.User}}' "zichan-sync-ci:${GITHUB_SHA}")" = node
          test "$(docker inspect --format '{{.Config.User}}' "$container")" = "$(id -u):$(id -g)"
          test "$(docker exec "$container" id -u)" != 0
          # State volume is writable by the unprivileged user.
          docker exec "$container" sh -c 'test -w /state/server'
          # The final image must carry a self-contained maintenance entry, not only
          # TypeScript output whose workspace imports need node_modules.
          mkdir -p "$RUNNER_TEMP/zichan-sync-backups"
          docker stop --time 60 "$container"
          docker run --rm --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$RUNNER_TEMP/zichan-sync-state,dst=/state" \
            --mount "type=bind,src=$RUNNER_TEMP/zichan-sync-backups,dst=/backups" \
            "zichan-sync-ci:${GITHUB_SHA}" \
            node dist/maintenance.mjs backup --data-dir /state/server --output /backups/ci
          docker run --rm --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$RUNNER_TEMP/zichan-sync-state,dst=/state" \
            --mount "type=bind,src=$RUNNER_TEMP/zichan-sync-backups,dst=/backups" \
            "zichan-sync-ci:${GITHUB_SHA}" \
            node dist/maintenance.mjs verify-backup --data-dir /state/server --backup /backups/ci
      - name: Upload container failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sync-server-container-failure-logs
          path: ci-artifacts/
          if-no-files-found: ignore

  browser-flows:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm ci --prefix tools/e2e
      - run: npm run install:chromium --prefix tools/e2e
      - run: npm run test:e2e
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tools/e2e/playwright-report/
            tools/e2e/test-results/
          if-no-files-found: ignore

  browser-account-flows:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/e2e/requirements.txt
      - run: python -m pip install -r tools/e2e/requirements.txt
      - run: npm ci
      - run: npm ci --prefix tools/e2e
      - run: npm run install:chromium --prefix tools/e2e
      - run: npm run test:e2e:account
      - name: Upload account Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: account-playwright-report
          path: |
            tools/e2e/playwright-report/
            tools/e2e/test-results/
          if-no-files-found: ignore
