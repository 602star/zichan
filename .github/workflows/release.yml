name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  windows:
    needs: checks
    uses: ./.github/workflows/windows-portable-release.yml

  windows-installer:
    needs: checks
    uses: ./.github/workflows/windows-installer-acceptance.yml
    with:
      signed: false
    secrets: inherit

  linux:
    needs: checks
    uses: ./.github/workflows/linux-desktop-release.yml

  android:
    needs: checks
    uses: ./.github/workflows/android-release.yml
    secrets: inherit

  sync-update:
    needs: checks
    uses: ./.github/workflows/sync-server-self-update-release.yml
    secrets: inherit

  image:
    needs: checks
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/sync-server-image.yml
    secrets: inherit

  publish:
    needs: [windows, windows-installer, linux, android, sync-update, image]
    runs-on: ubuntu-24.04
    environment: production-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify the tag still points to this commit
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --force --no-tags origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          test "$(git rev-parse "${GITHUB_REF_NAME}^{commit}")" = "$GITHUB_SHA"
          node scripts/release/check-consistency.mjs --tag "$GITHUB_REF_NAME"
      - uses: actions/download-artifact@v7
        with:
          name: windows-x64-portable
          path: release
      - uses: actions/download-artifact@v7
        with:
          name: windows-installer-candidates
          path: release
      - uses: actions/download-artifact@v7
        with:
          name: linux-x64-deb-appimage
          path: release
      - uses: actions/download-artifact@v7
        with:
          name: android-arm64-release
          path: release
      - uses: actions/download-artifact@v7
        with:
          name: signed-sync-update
          path: release
      - uses: actions/download-artifact@v7
        with:
          name: sync-server-image-digest
          path: release
      - name: Check every release asset
        shell: bash
        run: |
          set -Eeuo pipefail
          for bundle_dir in release/deb release/appimage release/msi release/nsis; do
            test -d "$bundle_dir"
            mv "$bundle_dir"/* release/
            rmdir "$bundle_dir"
          done
          test -z "$(find release -mindepth 1 -type d -print -quit)"
          shopt -s nullglob
          test "${#GITHUB_REF_NAME}" -gt 1
          version="${GITHUB_REF_NAME#v}"
          test -s "release/zichan-${version}.json"
          test -s "release/zichan-${version}.feed.json"
          test -s release/latest.json
          test -s release/android-latest.json
          test -s "release/zichan-${version}-android-arm64.apk"
          test -s release/image-digest.txt
          deb=(release/*.deb)
          appimage=(release/*.AppImage)
          portable=(release/*.zip)
          msi=(release/*.msi)
          nsis=(release/*-setup.exe)
          test "${#deb[@]}" -eq 1
          test "${#appimage[@]}" -eq 1
          test "${#portable[@]}" -eq 1
          test "${#msi[@]}" -eq 1
          test "${#nsis[@]}" -eq 1
          for asset in "${deb[0]}" "${appimage[0]}" "${portable[0]}" "${msi[0]}" "${nsis[0]}"; do
            test -s "$asset"
            test -s "$asset.sha256"
            (cd release && sha256sum --check "$(basename "$asset.sha256")")
          done
          (cd release && sha256sum --check SHA256SUMS)
          grep -Eq '^ghcr\.io/[^ ]+@sha256:[a-f0-9]{64}$' release/image-digest.txt
          # GitHub normalizes non-ASCII asset names. Rename verified Windows
          # artifacts and regenerate their checksum sidecars before upload.
          rename_windows_asset() {
            local source="$1" target="$2"
            mv "$source" "release/$target"
            rm "$source.sha256"
            (cd release && sha256sum "$target" > "$target.sha256" && sha256sum --check "$target.sha256")
          }
          rename_windows_asset "${portable[0]}" "zichan-${version}-windows-x64-portable.zip"
          rename_windows_asset "${msi[0]}" "zichan-${version}-windows-x64.msi"
          rename_windows_asset "${nsis[0]}" "zichan-${version}-windows-x64-setup.exe"
      - name: Publish the complete release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; refusing to overwrite assets" >&2
            exit 1
          fi
          notes="$RUNNER_TEMP/zichan-release-notes.md"
          node scripts/release/extract-release-notes.mjs "$GITHUB_REF_NAME" "$notes"
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --draft --title "$GITHUB_REF_NAME" --notes-file "$notes"
          gh release upload "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY"
          expected="$(find release -maxdepth 1 -type f -printf '%f\n' | sort)"
          actual="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | sort)"
          test "$actual" = "$expected"
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
